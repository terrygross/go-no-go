<head>

  <title>GO / NO-GO — Privacy Policy</title>
  <!--
    One privacy policy, one place. This file used to carry its own full copy,
    written in August 2026, and it went stale the moment v1.4 added accounts:
    it still said the app "does not collect, store, transmit, or share any
    personal data" while the app was signing people up. It ships inside the
    app bundle and is served by the old Cloud Run host, so a stale copy here
    is a false public statement and a Data-safety mismatch.

    The policy now lives only at gonogoboatapp.com/privacy, which is also the
    URL in the Play listing. This page sends readers there.
  -->
  <meta http-equiv="refresh" content="0; url=https://gonogoboatapp.com/privacy">
  <link rel="canonical" href="https://gonogoboatapp.com/privacy">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px;
           margin: 80px auto; padding: 0 24px; color: #1a1a1a; line-height: 1.7; }
    a { color: #0b7a4b; }
  </style>
</head>
<body>
  <h1>GO / NO-GO — Privacy Policy</h1>
  <p>Our privacy policy has moved to
     <a href="https://gonogoboatapp.com/privacy">gonogoboatapp.com/privacy</a>.</p>
  <p>If you are not redirected automatically, follow the link above. To close
     your account and erase your data, see
     <a href="https://gonogoboatapp.com/delete-account">Delete your account</a>.</p>
</body>
