# Builds a signed iOS app of GO / NO-GO and uploads it to TestFlight.
#
# Run it by hand from the Actions tab. TestFlight is beta distribution — the
# same binary is then submitted for App Review from App Store Connect.
#
# WHY THE CERTIFICATE IS A SECRET BUT THE PROFILE IS NOT
#
# -allowProvisioningUpdates lets Xcode create PROFILES on its own, but a new
# distribution CERTIFICATE needs a keychain to put the private key in, and a
# clean CI VM has none. So the certificate is supplied from a secret (made
# once by hand) and the App Store Connect API key does the profile work.
#
# SECRETS REQUIRED (Settings -> Secrets and variables -> Actions)
#
#   APP_STORE_CONNECT_KEY_ID       e.g. 2X9R4HXF34
#   APP_STORE_CONNECT_ISSUER_ID    the UUID on the Keys page
#   APP_STORE_CONNECT_PRIVATE_KEY  the WHOLE .p8 file, BEGIN/END lines included
#   IOS_DIST_P12_BASE64            contents of Documents\ios-signing\p12-base64.txt
#   IOS_DIST_P12_PASSWORD          contents of Documents\ios-signing\p12-password.txt
#
# Create the API key at App Store Connect -> Users and Access -> Integrations
# -> App Store Connect API, with the **App Manager** role. Apple lets you
# download the .p8 exactly once.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What testers should know about this build
        required: false
        default: Internal build
      marketing_version:
        description: Version shown in the store (keep it level with Google Play)
        required: false
        default: "1.4"

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      TEAM_ID: H5JL2T3Y4X
      SCHEME: App
      BUNDLE_ID: com.gonogo.marine
      PROFILE_NAME: GoNoGo iOS App Store
      # TestFlight rejects a build number it has seen before, so it has to rise
      # every run. The run number does that on its own and never repeats.
      BUILD_NUMBER: ${{ github.run_number }}
      MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}

    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: the Capacitor 8 CLI hard-fails on anything older with
      # "[fatal] The Capacitor CLI requires NodeJS >=22.0.0", and it only says
      # so at `cap sync` time — after the install and the web build have both
      # happily passed on the wrong version.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Two npm projects: the Vite app at the root, the Capacitor shell in app/.
      - name: Install dependencies
        run: |
          npm ci
          cd app && npm ci --legacy-peer-deps

      # The root build writes to dist/; the Capacitor config reads app/dist.
      - name: Build web assets
        run: |
          npm run build
          rm -rf app/dist
          cp -R dist app/dist

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync ios

      # Apple answers every bad credential with the same flat 401, so a wrong
      # Key ID, a wrong Issuer ID and a stray newline are indistinguishable at
      # the point of failure. This step separates them BEFORE the API call.
      #
      # The whitespace stripping is not paranoia: copying either value out of a
      # browser or Notepad picks up a trailing newline, it goes straight into
      # the signed JWT, and Apple rejects the token without ever saying why.
      #
      # Nothing here prints a secret. GitHub masks the values anyway; what is
      # printed is shape — length and character class — which is what actually
      # tells us which field was mispasted.
      - name: Check the App Store Connect credentials
        env:
          RAW_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          RAW_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_ID="$(printf '%s' "$RAW_KEY_ID" | tr -d '[:space:]')"
          ISSUER="$(printf '%s' "$RAW_ISSUER" | tr -d '[:space:]')"

          echo "Key ID:    ${#RAW_KEY_ID} characters as stored, ${#KEY_ID} after trimming"
          echo "Issuer ID: ${#RAW_ISSUER} characters as stored, ${#ISSUER} after trimming"

          ok=1

          # A Key ID is exactly 10 uppercase letters and digits.
          if ! printf '%s' "$KEY_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error::APP_STORE_CONNECT_KEY_ID is not a 10-character Key ID. It is the short code in the KEY ID column on App Store Connect -> Users and Access -> Integrations, and it is also in the downloaded filename: AuthKey_XXXXXXXXXX.p8"
            ok=0
          fi

          # An Issuer ID is a lowercase UUID: 8-4-4-4-12.
          if ! printf '%s' "$ISSUER" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::APP_STORE_CONNECT_ISSUER_ID is not a UUID. It is the long dashed code shown ABOVE the key table on the Integrations page, next to the words 'Issuer ID' — not the Key ID, and not the Team ID."
            ok=0
          fi

          # The two are easy to swap, and swapping them gives the same 401.
          if [ "$KEY_ID" = "$ISSUER" ]; then
            echo "::error::The Key ID and the Issuer ID are the same value. One of the two secrets holds the wrong field."
            ok=0
          fi

          [ "$ok" = "1" ] || exit 1

          echo "Both credentials are the right shape."

          # Used by every later step, trimmed, so a stray newline cannot reach
          # the JWT, the filename or the xcodebuild arguments.
          echo "ASC_KEY_ID=$KEY_ID"  >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER" >> "$GITHUB_ENV"

      # xcodebuild reads the key from a file path, so it has to land on disk,
      # outside the workspace so no build step or artifact can pick it up.
      # The key goes through an env var rather than being interpolated into the
      # script: a secret containing anything shell-significant would otherwise
      # corrupt the script itself.
      #
      # The CR stripping is the point of this step. A .p8 copied out of Notepad
      # on Windows arrives CRLF-terminated and xcodebuild rejects it with
      # "Invalid authentication key credential (invalidPEMDocument)" — a message
      # that says nothing about line endings.
      - name: Place the App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          P8=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_KEY" | tr -d '\r' > "$P8"
          chmod 600 "$P8"

          if ! grep -q 'BEGIN PRIVATE KEY' "$P8"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY has no BEGIN PRIVATE KEY line. Paste the whole .p8, including the BEGIN and END lines."
            exit 1
          fi
          if ! openssl pkcs8 -nocrypt -inform PEM -in "$P8" -out /dev/null 2>/dev/null; then
            echo "::error::The key is not valid PKCS#8 PEM. Re-copy the .p8 exactly as Apple downloaded it."
            echo "first line: $(head -1 "$P8")"
            exit 1
          fi
          echo "API key parses as valid PKCS#8 PEM"

      - name: Import the signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::IOS_DIST_P12_BASE64 is not set."
            exit 1
          fi

          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(uuidgen)"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT"

          # A dedicated keychain, not the login one: unlocked with a throwaway
          # password and thrown away with the VM.
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$CERT" -P "$CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"

          # Without this, codesign prompts for permission and hangs the build
          # until the job times out.
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          echo "--- signing identities now available ---"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution\|iPhone Distribution"; then
            echo "::error::No distribution identity in the keychain. The .p12 may be the wrong certificate type, or the password is wrong."
            exit 1
          fi

          # Apple renamed this certificate type: new ones are "Apple
          # Distribution", ones issued before 2021 are "iPhone Distribution".
          # Either signs an App Store build, but CODE_SIGN_IDENTITY has to say
          # which, so read it off the certificate instead of assuming.
          if security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "SIGN_IDENTITY=Apple Distribution" >> "$GITHUB_ENV"
          else
            echo "SIGN_IDENTITY=iPhone Distribution" >> "$GITHUB_ENV"
          fi

      # Creates the App Store provisioning profile outright rather than letting
      # Xcode infer one. Left to itself Xcode asks for a DEVELOPMENT profile —
      # Capacitor's template sets CODE_SIGN_IDENTITY to "iPhone Developer" —
      # and then fails with "your team has no devices", which is true and
      # entirely beside the point for an App Store build.
      - name: Ensure an App Store provisioning profile
        id: profile
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'PROF'
          import os, time, json, base64, pathlib, urllib.request, urllib.error, jwt

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          bundle = os.environ["BUNDLE_ID"]
          pname  = os.environ["PROFILE_NAME"]
          pem    = open(os.path.expanduser("~/private_keys/AuthKey_%s.p8" % key_id)).read()

          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 900,
               "aud": "appstoreconnect-v1"},
              pem, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})

          def call(path, method="GET", body=None):
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/" + path,
                  method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + token,
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, (json.load(r) if r.status != 204 else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:600]

          st, bids = call("bundleIds?filter[identifier]=" + bundle)

          # The first call to Apple, so it is where a bad credential surfaces.
          # Apple returns the same 401 for a wrong Key ID, a wrong Issuer ID, a
          # revoked key and a key belonging to another account, so spell out
          # the possibilities rather than printing its one-line complaint.
          if st == 401:
              print("::error::Apple rejected the API key (401). The key file itself is valid PKCS#8 and the Key ID and Issuer ID are both the right shape, so one of these is true: (a) APP_STORE_CONNECT_PRIVATE_KEY is a DIFFERENT key from the one APP_STORE_CONNECT_KEY_ID names; (b) the Issuer ID belongs to another App Store Connect account; (c) the key has been revoked on the Integrations page. Check that the Key ID matches the downloaded filename AuthKey_<KEY ID>.p8 of the key you actually pasted.")
              print(bids)
              raise SystemExit(1)
          if st == 403:
              print("::error::Apple accepted the key but refused the request (403). The key's role is too low — it needs App Manager. Revoke it and make a new one with that role.")
              print(bids)
              raise SystemExit(1)
          if st != 200:
              print("::error::Unexpected reply from App Store Connect: %s" % st)
              print(bids)
              raise SystemExit(1)
          if not bids["data"]:
              print("::error::No bundle ID '%s' exists in this App Store Connect account. Either the app record is in a different account, or the identifier differs." % bundle)
              raise SystemExit(1)

          bid = bids["data"][0]["id"]
          print("bundle id resource:", bid)

          st, certs = call("certificates?filter[certificateType]=DISTRIBUTION")
          assert st == 200 and certs["data"], ("no distribution certificate", st, certs)
          cert_id = certs["data"][0]["id"]
          print("certificate:", certs["data"][0]["attributes"]["name"])

          st, profs = call("profiles?limit=200")
          existing = [x for x in profs.get("data", []) if x["attributes"]["name"] == pname]
          for x in list(existing):
              if x["attributes"]["profileState"] != "ACTIVE":
                  print("deleting stale profile", x["id"], x["attributes"]["profileState"])
                  call("profiles/" + x["id"], "DELETE")
                  existing.remove(x)

          if existing:
              prof = existing[0]
              print("reusing profile:", prof["attributes"]["name"])
          else:
              st, created = call("profiles", "POST", {"data": {
                  "type": "profiles",
                  "attributes": {"name": pname, "profileType": "IOS_APP_STORE"},
                  "relationships": {
                      "bundleId": {"data": {"type": "bundleIds", "id": bid}},
                      "certificates": {"data": [{"type": "certificates", "id": cert_id}]}}}})
              if st not in (200, 201):
                  print("::error::Could not create the provisioning profile")
                  print(created)
                  raise SystemExit(1)
              prof = created["data"]
              print("created profile:", prof["attributes"]["name"])

          uuid = prof["attributes"]["uuid"]
          dest = pathlib.Path.home() / "Library/MobileDevice/Provisioning Profiles"
          dest.mkdir(parents=True, exist_ok=True)
          (dest / (uuid + ".mobileprovision")).write_bytes(
              base64.b64decode(prof["attributes"]["profileContent"]))
          print("installed profile uuid:", uuid)

          # Handed to xcodebuild by UUID rather than by name. Names are not
          # unique and Xcode picks silently between duplicates; a UUID names
          # exactly the profile that was installed a line ago.
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("PROFILE_UUID=%s\n" % uuid)
          PROF

      # Capacitor 8 uses Swift Package Manager, so there is no .xcworkspace and
      # no Podfile — the project builds directly.
      #
      # MANUAL SIGNING, AND WHY -allowProvisioningUpdates IS GONE
      #
      # Capacitor's template leaves CODE_SIGN_STYLE on Automatic. Automatic
      # signing decides for itself what kind of profile an archive needs, asks
      # Apple for a DEVELOPMENT one, and fails with
      #
      #   Your team has no devices from which to generate a provisioning profile
      #   No profiles for 'com.gonogo.marine' were found
      #
      # which is true and irrelevant: a store build needs no devices. Installing
      # the right profile beforehand does not help, because automatic signing
      # never looks at it. So the choice is taken away — manual style, the
      # distribution identity, and the exact profile installed in the previous
      # step. -allowProvisioningUpdates is dropped with it: it exists to let
      # Xcode invent profiles, which is the behaviour being prevented.
      - name: Archive
        working-directory: app/ios/App
        run: |
          set -o pipefail
          echo "signing with: $SIGN_IDENTITY / profile $PROFILE_UUID"
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # The checked-in ExportOptions.plist names the certificate type and the
      # profile as fixed strings. Both are now known for real — the type read
      # off the certificate, the profile by the UUID that was installed — so
      # the plist is copied and those two values overwritten. Exporting with a
      # different identity or profile from the one the archive was signed with
      # is a re-sign, and it is how an .ipa ends up rejected at upload.
      - name: Export the .ipa
        working-directory: app/ios/App
        run: |
          set -o pipefail
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :signingCertificate $SIGN_IDENTITY" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $PROFILE_UUID" "$PLIST"
          echo "--- export options actually used ---"
          cat "$PLIST"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$PLIST" \
            -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"

      # Checked before the upload rather than after, because a rejected upload
      # still burns a build number and several minutes.
      - name: Check the .ipa before sending it
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          test -n "$IPA" || { echo "no .ipa was produced"; exit 1; }
          echo "ipa: $IPA ($(du -h "$IPA" | cut -f1))"

          rm -rf "$RUNNER_TEMP/peek" && mkdir -p "$RUNNER_TEMP/peek"
          unzip -q "$IPA" -d "$RUNNER_TEMP/peek"
          APP=$(ls -d "$RUNNER_TEMP/peek/Payload"/*.app | head -1)

          echo "--- identity ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier'         "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'            "$APP/Info.plist"

          echo "--- it must be signed, or TestFlight refuses it ---"
          codesign -dv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier'

          echo "--- the app asks for location, so Apple requires this string ---"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$APP/Info.plist"
          echo "OK"

      - name: Upload to TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey ${ASC_KEY_ID} \
            --apiIssuer ${ASC_ISSUER_ID}
        env:
          API_PRIVATE_KEYS_DIR: ~/private_keys

      - name: Tidy up the key
        if: always()
        run: rm -rf ~/private_keys

      - name: What happens next
        run: |
          echo "Uploaded build $BUILD_NUMBER (version $MARKETING_VERSION)."
          echo "Apple processes it for 5-15 minutes before it shows in TestFlight."
          echo "Then pick it as the build for the App Store version and submit for review."
          echo "Notes for testers: ${{ github.event.inputs.notes }}"
